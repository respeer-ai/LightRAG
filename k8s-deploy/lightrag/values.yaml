replicaCount: 1

image:
  repository: uhub.service.ucloud.cn/entropypool/lightrag-respeer
  tag: respeer-v1.4.3
  imagePullPolicy: always

service:
  type: ClusterIP
  port: 9621

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 100m
    memory: 100Mi

persistence:
  enabled: true
  ragStorage:
    size: 5Gi
  inputs:
    size: 5Gi

env:
  MAX_GRAPH_NODES: 10000
  OLLAMA_EMULATING_MODEL_TAG: ${OLLAMA_EMULATING_MODEL_TAG}
  TAG: ${LINERA_TAG}
  ASYNC_GRAPHQL_COMMIT: ${ASYNC_GRAPHQL_COMMIT}
  LINERA_DOCUMENTATION_COMMIT: ${LINERA_DOCUMENTATION_COMMIT}
  HOST: 0.0.0.0
  PORT: 9621
  AUTH_ACCOUNTS: ${AUTH_ACCOUNTS}
  WEBUI_TITLE: Graph RAG Engine
  WEBUI_DESCRIPTION: Simple and Fast Graph Based RAG System
  LLM_BINDING: openai
  LLM_MODEL: ${LLM_MODEL}
  LLM_BINDING_HOST: ${LLM_BINDING_HOST}
  LLM_BINDING_API_KEY: ${LLM_BINDING_API_KEY}
  EMBEDDING_BINDING: openai
  EMBEDDING_MODEL: ${EMBEDDING_MODEL}
  EMBEDDING_DIM: 1536
  EMBEDDING_BINDING_API_KEY: ${EMBEDDING_BINDING_API_KEY}
  LIGHTRAG_KV_STORAGE: PGKVStorage
  LIGHTRAG_VECTOR_STORAGE: PGVectorStorage
#  LIGHTRAG_KV_STORAGE: RedisKVStorage
#  LIGHTRAG_VECTOR_STORAGE: QdrantVectorDBStorage
  LIGHTRAG_GRAPH_STORAGE: Neo4JStorage
  LIGHTRAG_DOC_STATUS_STORAGE: PGDocStatusStorage
  # Replace with your POSTGRES credentials
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: mypassword
  POSTGRES_DATABASE: postgres
  POSTGRES_WORKSPACE: default
  # Replace with your NEO4J credentials
  NEO4J_URI: neo4j://neo4j-service:7687
  NEO4J_USERNAME: neo4j
  NEO4J_PASSWORD: yourpassword
  # Replace with your Qdrant credentials
  QDRANT_URL: http://qdrant-service:6333
  # REDIS_URI: redis://default:${REDIS_PASSWORD}@redis-cluster-redis-redis:6379
