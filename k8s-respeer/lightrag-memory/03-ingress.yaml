apiVersion: networking.k8s.io/v1beta1
kind: Ingress
metadata:
  name: lightrag-linera-respeer-master-ingress
  namespace: kube-system
  annotations:
    k8s.kuboard.cn/displayName: lightrag-linera-respeer-master-service
    k8s.kuboard.cn/workload: lightrag-linera-respeer-master-service
    kubernetes.io/ingress.class: "traefik-internet"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure, web
    traefik.ingress.kubernetes.io/router.middlewares:
      kube-system-http-redirect-https@kubernetescrd,
      kube-system-http-redirect-https-testing@kubernetescrd,
      kube-system-common-headers@kubernetescrd

spec:
  tls:
    - hosts:
        - '*.linera-rag.respeer.ai'
        - linera-rag.respeer.ai
      secretName: linera-rag-respeer-ai-tls
  rules:
    - host: lightrag-linera-respeer-master.linera-rag.respeer.ai
      http:
        paths:
          - path: /
            backend:
              serviceName: lightrag-linera-respeer-master-service
              servicePort: 9621
